name: Generate contribution snake

# Renders the real GitHub contribution graph as a "snake eating the grid"
# animation, using the widely-used open-source Platane/snk action. Reads
# only public contribution data via the GitHub API — no fabricated activity.
on:
  schedule:
    - cron: "35 3 * * *" # once a day, shortly after update-stats.yml
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: generate-snake
  cancel-in-progress: true

jobs:
  snake:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Generate snake SVGs
        uses: Platane/snk@v3
        with:
          github_user_name: sushil-choudhary
          outputs: |
            assets/snake-dark.svg?palette=github-dark
            assets/snake-light.svg?palette=github-light

      - name: Commit changes if any
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/snake-dark.svg assets/snake-light.svg
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git commit -m "chore: regenerate contribution snake [skip ci]"
          git push
